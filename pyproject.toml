[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — conversational voice assistant for macOS with Cursor delegation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.0",
  "av>=12.3.0,<19",
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "nicegui>=2.0.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "sounddevice>=0.5.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
